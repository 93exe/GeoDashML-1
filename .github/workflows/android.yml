name: Build Geode Mod (Android ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: '5.11.2'
          target: 'Android64'
          path: 'mods/bridge'
          # build-config не указан — по умолчанию Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdml-bridge-android-arm64
          path: ${{ steps.build.outputs.build-output }}
