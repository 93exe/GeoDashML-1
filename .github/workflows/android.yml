name: Build Geode Mod (Android arm64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode SDK
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: '5.11.2'
          target: 'Android'
          arch: 'arm64-v8a'
          build-type: 'Release'
          output: 'combined.geode'

      - uses: actions/upload-artifact@v4
        with:
          name: combined-geode
          path: combined.geode
